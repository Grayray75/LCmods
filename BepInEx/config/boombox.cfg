[Config]

## Include the default songs in the rotation. Cannot be used with On-Demand Loading.
# Setting type: Boolean
# Default value: false
Use Default Songs = false

## (Not possible for Opus) Requires less memory and takes less time to load, but prevents playing the same song twice at once.
# Setting type: Boolean
# Default value: false
Stream Audio From Disk = false

## Higher values provide better quality, but use more memory. I think the supported values are 8000, 16000, 32000, and 48000 (not 41800). I've set the default to 16000 because slightly lower quality is funny.
# Setting type: Int32
# Default value: 16000
Opus Decoding Sample Rate = 48000

## Pull songs from the `Custom Songs/Boombox Music` folder. I don't think anyone ever pulls songs from here.
# Setting type: Boolean
# Default value: true
Use Custom Songs Folder = false

## Pull songs from the `Config/Custom Songs` folder. In case you share your songs via Thunderstore codes.
# Setting type: Boolean
# Default value: false
Use Config Folder = false

## Searches and pulls for songs from any downloaded Plugins or other Mods (in their Custom Songs folders). So you don't need any "Fix" mods.
# Setting type: Boolean
# Default value: true
Search For Custom Songs = true

## A lot of "Fix" mods just copy songs to the right spot, doubling the amount of space used. This option will clean that up for you. False by default to prevent accidental unwanted behaviour.
# Setting type: Boolean
# Default value: false
Delete Custom Songs Folder = false

[On Demand Loading]

## (EXPERIMENTAL) Enable on-demand loading, where only a subset of songs are loaded into memory at once, and new songs are loaded in as needed, reducing memory usage and load times at the start of the game.
# Setting type: Boolean
# Default value: false
Enable = false

## How many songs to have loaded in memory at once.
# Setting type: Int32
# Default value: 10
Loaded Songs Count = 10

## How many threads should be spawned to load songs in parallel. Set to 0 to use how many logical cores your CPU has divided by 2. It is recommended to leave this at 0 unless you know what you're doing.
# Setting type: Int32
# Default value: 0
Song Loading Thread Count = 0

